name: Format code

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format source and configuration files
        run: npx --yes prettier@3.6.2 --write "**/*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,css,md,yml,yaml}"

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "All supported files are already formatted."
          else
            git commit -m "style: format code for readability"
            git push origin main
          fi
